<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Current Recap</title>
<meta name="description" content="A recap of the stories, podcasts and discussions you have interacted with across Meta platforms, organised for later.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('recap.theme2')==='dark'?'dark':'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="app"><p class="fatal">Loading Current Recap…</p></div>
<noscript>Current Recap needs JavaScript.</noscript>
<script>
/* If the app script fails to start, say why instead of showing "Loading" forever. */
(function () {
  var shown = false;
  function show(why) {
    if (shown) return; var app = document.getElementById('app'); if (!app || !app.querySelector('.fatal')) return; shown = true;
    app.innerHTML = '<div class="fatal" style="max-width:560px;font:16px/1.5 system-ui,sans-serif">'
      + '<h2 style="margin:0 0 8px">Current Recap could not start</h2>'
      + '<p style="margin:0 0 8px">' + String(why).replace(/[<>&]/g, '') + '</p>'
      + '<p style="margin:0 0 12px">Usually a file did not upload completely, or the browser is holding an old copy. Press <b>Reset app cache</b>, then reload.</p>'
      + '<button id="rc-reset" style="padding:10px 16px;font:inherit;cursor:pointer">Reset app cache</button></div>';
    document.getElementById('rc-reset').onclick = function () {
      var done = function () { location.reload(); };
      Promise.all([
        navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : 0,
        window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }) : 0
      ]).then(done, done);
    };
  }
  window.addEventListener('error', function (e) { show((e.message || 'Script error') + (e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ')' : '')); });
  window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.message) || 'Start-up failed'); });
  setTimeout(function () { show('The app did not finish starting within 10 seconds.'); }, 10000);
})();
</script>
<script type="module" src="assets/js/app.js?v=14"></script>
</body>
</html>
